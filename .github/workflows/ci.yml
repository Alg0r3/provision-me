---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Run lint
        run: make lint

  molecule:
    name: Molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    needs:
      - lint

    strategy:
      fail-fast: false
      matrix:
        role:
          - bootstrap
          - fish
          - wezterm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: make install

      - name: Check development environment
        run: make doctor

      - name: Test role
        run: make test-role ROLE=${{ matrix.role }}

  required:
    name: Required
    runs-on: ubuntu-latest
    needs:
      - lint
      - molecule
    if: always()

    steps:
      - name: Check required jobs
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.molecule.result }}" = "success"
